[pytest]
markers =
    smoke: smoke tests that are allowed to run in CI on push
    manual: tests that must run only manually
    payments: payment-focused checks
    native: tests that exercise native Android screens
    webview: tests that require WebView context
    browserstack_safe: checks that are allowed to run on BrowserStack before WebView debugging is enabled
    web: browser-based OnlineDuken tests that run outside the mobile container
