name: push-web-smoke

on:
  push:
  workflow_dispatch:
    inputs:
      force_run:
        description: Run smoke even if push smoke is temporarily disabled
        required: false
        default: true
        type: boolean

# Push smoke covers the frontend tier only: the OnlineDuken web suite in a
# headless browser with a bootstrapped auth token. Mobile flows run locally
# on the emulator during development; BrowserStack device runs are manual
# (mobile-manual workflow) and reserved for cross-platform checks.
jobs:
  smoke-onlineduken-web:
    if: github.event_name != 'push' || vars.ENABLE_PUSH_SMOKE != 'false' || inputs.force_run == true
    runs-on: ubuntu-latest
    env:
      TARGET: local
      WEB_BROWSER: chrome
      WEB_HEADLESS: "true"
      B2B_SHARED_AUTH_BOOTSTRAP: "true"
      B2B_APP_AUTH_BOOTSTRAP: "false"
      B2B_AUTH_URL: ${{ secrets.B2B_AUTH_URL }}
      B2B_OB_AUTH_TOKEN: ${{ secrets.B2B_OB_AUTH_TOKEN }}
      B2B_INTERNAL_LOGIN_URL: ${{ secrets.B2B_INTERNAL_LOGIN_URL }}
      B2B_INTERNAL_CLIENT_ID: ${{ secrets.B2B_INTERNAL_CLIENT_ID }}
      B2B_INTERNAL_CLIENT_SECRET: ${{ secrets.B2B_INTERNAL_CLIENT_SECRET }}
      B2B_INTERNAL_GRANT_TYPE: ${{ secrets.B2B_INTERNAL_GRANT_TYPE }}
      TEST_ENV_HEALTHCHECK_URLS: ${{ secrets.TEST_ENV_HEALTHCHECK_URLS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Check test environment availability
        id: envcheck
        run: python -m mobile_automation.healthcheck --github-output || true

      - name: Print skip reason
        if: steps.envcheck.outputs.available != 'true'
        run: echo "Test environment is unavailable. Smoke run is skipped."

      - name: Run web smoke suite
        if: steps.envcheck.outputs.available == 'true'
        run: pytest -m web -n 2 --maxfail=1 --alluredir=allure-results

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-smoke-${{ github.run_number }}
          path: allure-results
          if-no-files-found: ignore
